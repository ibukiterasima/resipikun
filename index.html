<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スーパーレシピくん</title>
<link rel="icon" type="image/jpeg" href="icon.jpg?v=2">
<link rel="shortcut icon" type="image/jpeg" href="icon.jpg?v=2">
<link rel="apple-touch-icon" href="icon.jpg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<!-- Firebase (無料のSparkプランで利用可) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#FDFBF6; --surface:#FFFFFF; --ink:#2A2420; --ink-soft:#6B6055;
  --accent:#E0982E; --accent-ink:#5C3E10; --green:#4A7A5C; --line:#E7DFD0;
  --tag-bg:#F3EEE2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1B18; --surface:#26231F; --ink:#F1EAE0; --ink-soft:#B3A99B;
    --accent:#F0A93E; --accent-ink:#2A1D08; --green:#7FBF97; --line:#3A352E; --tag-bg:#332D24;
  }
}
*{box-sizing:border-box}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Zen Maru Gothic',sans-serif;line-height:1.6;}
h1,h2,h3{font-family:'Zen Maru Gothic',sans-serif;font-weight:900;margin:0;}
button{font-family:inherit;cursor:pointer;}
input,textarea{font-family:inherit;}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom,0px));}
header{position:sticky;top:0;background:var(--bg);z-index:20;border-bottom:1px solid var(--line);padding-top:12px;}
.headrow{max-width:640px;margin:0 auto;padding:0 16px 10px;display:flex;align-items:center;gap:12px;}
.logo{font-size:22px;letter-spacing:-0.5px;flex:1;}
.logo span{color:var(--accent);}
.userchip{display:flex;align-items:center;gap:6px;font-size:14px;background:var(--surface);border:1px solid var(--line);padding:6px 10px;border-radius:99px;}
.searchrow{max-width:640px;margin:0 auto;padding:0 16px 12px;display:flex;gap:6px;}
.searchrow input{flex:1;min-width:0;padding:9px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;}
.searchrow input:focus{outline:2px solid var(--accent);outline-offset:-1px;}
.addbtn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:99px;padding:9px 14px;font-weight:800;font-size:13.5px;white-space:nowrap;flex-shrink:0;}
@media (max-width:380px){
  .searchrow input{font-size:13px;padding:8px 10px;}
  .addbtn{font-size:12px;padding:8px 10px;}
  .headrow{gap:8px;}
  .logo{font-size:19px;}
}
.bottomnav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:30;box-shadow:0 -2px 10px rgba(0,0,0,.04);}
.bottomnav-inner{display:flex;max-width:640px;margin:0 auto;width:100%;}
.bottomnav button{flex:1;background:none;border:none;padding:11px 4px 9px;font-size:12.5px;font-weight:700;color:var(--ink-soft);border-top:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px;}
.bottomnav button svg{width:22px;height:22px;}
.bottomnav button.active{color:var(--accent);border-top-color:var(--accent);}
@media (min-width:420px){ .bottomnav button{font-size:13.5px;padding:13px 4px 10px;} .bottomnav button svg{width:24px;height:24px;} }
.feedcard{padding:22px 0;border-bottom:1px solid var(--line);}
.author{display:flex;align-items:center;gap:9px;margin-bottom:10px;cursor:pointer;}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--tag-bg);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.avatar svg{width:60%;height:60%;color:var(--ink-soft);}
.author b{font-size:14px;}
.photo{width:100%;aspect-ratio:4/3;border-radius:12px;background:var(--tag-bg);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:12px;}
.photo img{width:100%;height:100%;object-fit:cover;}
.photo svg{width:30%;height:30%;color:var(--ink-soft);}
.photo-upload{position:relative;width:100%;aspect-ratio:4/3;border-radius:12px;background:var(--tag-bg);display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;overflow:hidden;border:1px dashed var(--line);cursor:pointer;}
.photo-upload img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.photo-upload svg{width:26%;height:26%;color:var(--ink-soft);}
.photo-upload span{position:relative;font-size:12.5px;color:var(--ink-soft);font-weight:700;}
.photo-upload.has-photo span{position:absolute;bottom:8px;background:rgba(0,0,0,.55);color:#fff;padding:3px 10px;border-radius:99px;}
.avatar-upload{position:relative;width:64px;height:64px;border-radius:50%;background:var(--tag-bg);display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px dashed var(--line);cursor:pointer;flex-shrink:0;}
.avatar-upload img{width:100%;height:100%;object-fit:cover;}
.avatar-upload svg{width:44%;height:44%;color:var(--ink-soft);}
.title{font-size:19px;margin-bottom:8px;}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.tag{background:var(--tag-bg);color:var(--ink-soft);font-size:12px;padding:3px 10px;border-radius:99px;}
.actions{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.actions button{background:none;border:none;font-size:14px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;padding:4px 0;}
.actions button.on{color:var(--accent);font-weight:700;}
.viewlink{margin-left:auto;background:none;border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:13px;color:var(--ink);}
.empty{padding:60px 16px;text-align:center;color:var(--ink-soft);}
.empty h3{margin-bottom:8px;color:var(--ink);}
.mygrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-top:18px;}
.mycard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;}
.mycard .photo{aspect-ratio:1/1;border-radius:0;margin:0;}
.mycard .body{padding:10px 12px 12px;}
.mycard .body b{font-size:14px;display:block;margin-bottom:4px;}
.mycard .pub{font-size:11px;color:var(--green);font-weight:700;}
section.panel{padding-top:20px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--ink-soft);}
.field input[type=text],.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font-size:14px;}
.field textarea{min-height:60px;resize:vertical;}
.smallbtn{background:var(--tag-bg);border:none;border-radius:8px;padding:8px 10px;font-size:13px;color:var(--ink);}
.linkbtn{background:none;border:none;color:var(--ink-soft);font-size:13px;text-decoration:underline;padding:2px 0;}
.primary{background:var(--accent);color:var(--accent-ink);border:none;border-radius:99px;padding:12px 20px;font-weight:800;font-size:15px;width:100%;}
.secondary{background:none;border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:11px 20px;font-weight:700;font-size:14px;width:100%;}
.danger{color:#B3432E;border-color:#E9C3B8;}
.modal-bg{position:fixed;inset:0;background:rgba(20,16,10,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
.modal{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));}
@media(min-width:680px){.modal-bg{align-items:center;}.modal{border-radius:20px;max-height:80vh;}}
.modal h2{margin-bottom:14px;}
.mclose{float:right;background:none;border:none;font-size:22px;color:var(--ink-soft);line-height:1;}
.steplist li{margin-bottom:10px;font-size:14.5px;}
.ingr li{font-size:14.5px;margin-bottom:5px;}
.followbtn{border:1px solid var(--accent);color:var(--accent-ink);background:var(--tag-bg);border-radius:99px;padding:6px 16px;font-size:13px;font-weight:700;margin-left:auto;}
.followbtn.on{background:var(--accent);color:var(--accent-ink);}
.mprow{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.mprow .avatar{width:52px;height:52px;}
.msection{margin-bottom:26px;}
.msection h3{font-size:15px;margin-bottom:10px;}
.followlist span{display:inline-block;background:var(--tag-bg);border-radius:99px;padding:5px 12px;font-size:13px;margin:0 6px 6px 0;}
.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13.5px;z-index:60;opacity:0;transition:opacity .25s;max-width:88%;text-align:center;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <div class="headrow">
    <h1 class="logo">スーパー<span>レシピ</span>くん</h1>
    <div id="userArea"></div>
  </div>
  <div class="searchrow" id="searchRow">
    <input id="searchInput" type="text" placeholder="料理名やタグで検索">
    <button class="addbtn" id="addBtn" onclick="openAddModal()">レシピを投稿</button>
  </div>
</header>

<div class="wrap">
  <div id="feedView"></div>
  <div id="myView" style="display:none"></div>
  <div id="userPageView" style="display:none"></div>
  <div id="mypageView" style="display:none"></div>
  <div id="settingsView" style="display:none"></div>
</div>

<nav class="bottomnav">
  <div class="bottomnav-inner">
    <button data-tab="feed" class="active" onclick="switchTab('feed')"><span class="navicon" data-icon="feed"></span><span data-i18n="nav_feed"></span></button>
    <button data-tab="my" onclick="switchTab('my')"><span class="navicon" data-icon="my"></span><span data-i18n="nav_my"></span></button>

  </div>
</nav>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script>
/* ===== Supabase設定 =====
   SUPABASE_URL に「Project URL」（https://xxxx.supabase.co）を貼り付けてください。
   下の公開キー(publishable)はブラウザに置いて安全なキーです。秘密キー(secret)は絶対に書かないでください。 */
const SUPABASE_URL='https://gvjemxvtftotdhtammje.supabase.co';
const SUPABASE_KEY='sb_publishable_FJgW8nh-9PLw7_NOROzKaw_OF5g1iX-';

const ICON_DISH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="11" r="7.2"/><path d="M6.2 15.5c1.4 1.5 3.6 2.4 5.8 2.4s4.4-.9 5.8-2.4" stroke-linecap="round"/><path d="M4 20h16" stroke-linecap="round"/></svg>';
const ICON_PERSON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c0-3.6 3.1-6.5 7-6.5s7 2.9 7 6.5" stroke-linecap="round"/></svg>';
const NAV_ICONS={
  feed:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="4" width="17" height="16" rx="2.5"/><path d="M7.5 9h9M7.5 13h9M7.5 17h5.5" stroke-linecap="round"/></svg>',
  my:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3.5h12v17l-6-4-6 4v-17z" stroke-linejoin="round"/></svg>',
  mypage:ICON_PERSON,
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.2M12 18.3v2.2M20.5 12h-2.2M5.7 12H3.5M17.7 6.3l-1.5 1.5M7.8 16.2l-1.5 1.5M17.7 17.7l-1.5-1.5M7.8 7.8L6.3 6.3" stroke-linecap="round"/></svg>'
};


const SESSION_KEY='src_session_v1';
const ADMIN_KEY='src_admin_v1';
const ADMIN_PASSWORDS=['resipikun','Poteotechanibuki'];
let DB={ recipes:[], myRecipes:[], saved:[], follows:[], users:{}, currentUser:null, currentUserDocId:null, history:[], interests:{}, isAdmin:false };
let sb=null, onlineMode=false;
let currentTab='feed', viewedUser=null;
let pendingCallback=null, pendingEmail=null, editingId=null, tempPhoto=null, tempProfilePhoto=undefined;
let bulkMode='public';
let followSearchResults=[], followSearchTimer=null;
let adminUsers=null;

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
function chk(res){ if(res.error) throw res.error; return res.data; }
function errMsg(e){
  if(!e) return '不明なエラー';
  if(typeof e==='string') return e;
  const parts=[e.message,e.details,e.hint,e.code].filter(Boolean);
  if(parts.length) return parts.join(' / ');
  try{ return JSON.stringify(e); }catch(_){ return String(e); }
}
window.addEventListener('unhandledrejection',ev=>{ console.error(ev.reason); toast('エラー：'+errMsg(ev.reason)); });
function photoContent(obj){ return obj && obj.photo ? '<img src="'+obj.photo+'" alt="">' : ICON_DISH; }
function avatarContent(username){ const u=DB.users[username]; return u && u.photo ? '<img src="'+u.photo+'" alt="">' : ICON_PERSON; }

/* 画像は縮小・圧縮してデータベースに直接保存（無料枠を節約） */
function compressImage(file,maxDim,maxLen){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){ if(w>h){ h=Math.round(h*maxDim/w); w=maxDim; } else { w=Math.round(w*maxDim/h); h=maxDim; } }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        let q=0.75, d=c.toDataURL('image/jpeg',q);
        while(d.length>maxLen && q>0.3){ q-=0.1; d=c.toDataURL('image/jpeg',q); }
        resolve(d);
      };
      img.onerror=()=>reject(new Error('image load failed'));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error('read failed'));
    reader.readAsDataURL(file);
  });
}

/* ---------- backend ---------- */
async function initBackend(){
  if(SUPABASE_URL.startsWith('YOUR_')){
    onlineMode=false; toast('SUPABASE_URLが未設定です。index.html内に貼り付けてください');
  } else {
    try{ sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY); onlineMode=true; }catch(e){ console.error(e); onlineMode=false; }
  }
  try{ if(localStorage.getItem(ADMIN_KEY)==='1') DB.isAdmin=true; }catch(e){}
  const saved=(()=>{ try{ return localStorage.getItem(SESSION_KEY); }catch(e){ return null; } })();
  if(onlineMode){
    await loadRecipes();
    if(saved) await resumeSession(saved);
    setInterval(()=>{ if(currentTab==='feed' && !viewedUser && !document.querySelector('.modal-bg')) loadRecipes(); },30000);
  }
  renderAll();
}
async function loadRecipes(){
  try{
    DB.recipes=chk(await sb.from('recipes').select('*').order('created',{ascending:false}).limit(60));
    if(currentTab==='feed' && !viewedUser) renderFeed();
  }catch(e){ console.error(e); toast(t('err_load_failed')+'：'+errMsg(e)); }
}
function applyUserRow(row){
  DB.currentUser=row.username; DB.currentUserDocId=row.id;
  DB.users[row.username]={bio:row.bio||'',photo:row.photo||null,email:row.email};
  DB.saved=row.saved_ids||[]; DB.follows=row.follows||[];
  const srv=row.interests||{}, merged=Object.assign({},srv), hadLocal=Object.keys(DB.interests).length>0;
  Object.keys(DB.interests).forEach(t=>{ merged[t]=Math.round(((merged[t]||0)+DB.interests[t])*10)/10; });
  DB.interests=merged; needRank=true;
  if(hadLocal) scheduleSaveInterests();
}
async function resumeSession(username){
  try{
    const rows=chk(await sb.from('users').select('*').eq('username',username).limit(1));
    if(rows.length){
      if(rows[0].suspended){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} return; }
      applyUserRow(rows[0]); await refreshMyRecipes();
    }
  }catch(e){ console.error(e); }
}
async function refreshMyRecipes(){
  if(!onlineMode || !DB.currentUser) return;
  try{
    const rows=chk(await sb.from('myrecipes').select('*').eq('owner',DB.currentUser).order('created',{ascending:false}));
    DB.myRecipes=rows.map(r=>Object.assign({},r,{sourceId:r.source_id,isPublic:r.is_public}));
  }catch(e){ console.error(e); }
}
async function ensureAuthorProfiles(names){
  const missing=names.filter(n=>!DB.users[n]);
  if(!missing.length || !onlineMode) return;
  try{
    const rows=chk(await sb.from('users').select('username,bio,photo').in('username',missing));
    rows.forEach(r=>{ DB.users[r.username]={bio:r.bio||'',photo:r.photo||null}; });
  }catch(e){ console.error(e); }
  missing.forEach(n=>{ if(!DB.users[n]) DB.users[n]={bio:'',photo:null}; });
}

/* ---------- login ---------- */
function requireLogin(action){
  if(DB.currentUser){ action(); return; }
  pendingCallback=action||null; openLoginModal();
}
function openLoginModal(){
  showModal(
    '<button class="mclose" onclick="closeModal()">×</button>'+
    '<h2>'+t('login_title')+'</h2>'+
    '<p style="color:var(--ink-soft);font-size:13.5px;margin-top:-6px">'+t('login_desc')+'</p>'+
    '<div class="field"><label>'+t('email_label')+'</label><input id="li_email" type="text" placeholder="you@example.com"></div>'+
    '<button class="primary" onclick="submitEmail()">'+t('btn_continue')+'</button>'
  );
}
async function submitEmail(){
  const raw=document.getElementById('li_email').value.trim();
  if(raw==='運営'){ openAdminPasswordModal(); return; }
  const email=raw.toLowerCase();
  if(!email || !email.includes('@')){ toast(t('err_enter_email')); return; }
  if(!onlineMode){ toast(t('err_no_server')); return; }
  try{
    const rows=chk(await sb.from('users').select('*').eq('email',email).limit(1));
    if(rows.length){
      if(rows[0].suspended){ toast(t('err_suspended')); return; }
      applyUserRow(rows[0]);
      try{ localStorage.setItem(SESSION_KEY,rows[0].username); }catch(e){}
      await refreshMyRecipes();
      closeModal(); toast(rows[0].username+t('toast_login_ok_suffix')); renderAll();
      if(pendingCallback){ const cb=pendingCallback; pendingCallback=null; cb(); }
      return;
    }
    pendingEmail=email;
    showModal(
      '<button class="mclose" onclick="closeModal()">×</button>'+
      '<h2>'+t('signup_title')+'</h2>'+
      '<p style="color:var(--ink-soft);font-size:13.5px;margin-top:-6px">'+email+t('signup_desc_suffix')+'</p>'+
      '<div class="field"><label>'+t('username_label')+'</label><input id="li_name" type="text" placeholder="'+t('username_ph')+'"></div>'+
      '<button class="primary" onclick="finishSignup()">'+t('btn_signup')+'</button>'
    );
  }catch(e){ console.error(e); toast(t('err_network')+'：'+errMsg(e)); }
}
async function finishSignup(){
  const name=document.getElementById('li_name').value.trim();
  if(!name){ toast(t('err_enter_username')); return; }
  try{
    const dup=chk(await sb.from('users').select('id').eq('username',name).limit(1));
    if(dup.length){ toast(t('err_username_taken')); return; }
    const row=chk(await sb.from('users').insert({username:name,email:pendingEmail,bio:'',saved_ids:[],follows:[]}).select().single());
    applyUserRow(row); pendingEmail=null;
    try{ localStorage.setItem(SESSION_KEY,name); }catch(e){}
    closeModal(); toast(name+t('toast_signup_ok_suffix')); renderAll();
    if(pendingCallback){ const cb=pendingCallback; pendingCallback=null; cb(); }
  }catch(e){ console.error(e); toast(t('err_network')+'：'+errMsg(e)); }
}
function logout(){
  DB.currentUser=null; DB.currentUserDocId=null; DB.saved=[]; DB.follows=[]; DB.myRecipes=[]; DB.interests={}; needRank=true;
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
  toast(t('toast_logout')); switchTab('feed');
}

/* ---------- admin ---------- */
function openAdminPasswordModal(){
  showModal(
    '<button class="mclose" onclick="closeModal()">×</button>'+
    '<h2>管理者パスワード</h2>'+
    '<div class="field"><label>パスワード</label><input id="admin_pw" type="password" placeholder="パスワード"></div>'+
    '<button class="primary" onclick="submitAdminPassword()">開く</button>'
  );
}
function submitAdminPassword(){
  const pw=document.getElementById('admin_pw').value;
  if(!ADMIN_PASSWORDS.includes(pw)){ toast('パスワードが違います'); return; }
  DB.isAdmin=true;
  try{ localStorage.setItem(ADMIN_KEY,'1'); }catch(e){}
  closeModal(); toast('管理者モードを有効にしました'); renderAll();
}
function adminLogout(){
  DB.isAdmin=false;
  try{ localStorage.removeItem(ADMIN_KEY); }catch(e){}

/* ---------- レシピ内容の翻訳（MyMemory 無料API・キー不要／元言語は日本語想定） ---------- */
let translationCache={};
function translateOne(text,target){
  if(!text || !text.trim()) return Promise.resolve(text);
  const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=ja|'+target;
  return fetch(url).then(r=>r.json()).then(d=>{
    const out=d&&d.responseData&&d.responseData.translatedText;
    return out ? out : text;
  }).catch(()=>text);
}
async function translateRecipe(r,full){
  if(full===undefined) full=true;
  if(LANG==='ja') return r;
  const key=r.id+'|'+LANG+(full?'':'|lite');
  if(translationCache[key]) return translationCache[key];
  const arr=(list)=>Promise.all((list||[]).map(x=>translateOne(x,LANG)));
  try{
    if(!full){
      const [title,tags]=await Promise.all([ translateOne(r.title,LANG), arr(r.tags) ]);
      const out={title, tags, ingredients:r.ingredients, steps:r.steps};
      translationCache[key]=out;
      return out;
    }
    const [title,ingredients,steps,tags]=await Promise.all([
      translateOne(r.title,LANG),
      arr(r.ingredients),
      arr(r.steps),
      arr(r.tags)
    ]);
    const out={title,ingredients,steps,tags};
    translationCache[key]=out;
    return out;
  }catch(e){ console.warn(e); return r; }
}

/* あなたへのおすすめ：行動から興味（タグの重み）を学習して並び順に反映 */
function personalScore(r){
  let s=0;
  (r.tags||[]).forEach(t=>{ s+=(DB.interests[t]||0)*3; });
  if(DB.follows.includes(r.author)) s+=6;
  if(DB.currentUser && r.author===DB.currentUser) s-=4;
  s+=(r.likes||[]).length*1.5;
  const ageDays=Math.max(0,(Date.now()-(r.created||0))/86400000);
  s+=Math.max(0,1-ageDays/14)*4;
  return s;
}
function searchRelevance(r,q){
  let s=0;
  if(r.title.includes(q)) s+=10;
  if((r.tags||[]).some(t=>t===q)) s+=8; else if((r.tags||[]).some(t=>t.includes(q))) s+=5;
  if(r.author.includes(q)) s+=3;
  return s;
}
function bumpTags(tags,w){
  if(!tags||!tags.length) return;
  Object.keys(DB.interests).forEach(k=>{ DB.interests[k]=Math.round(DB.interests[k]*0.97*100)/100; if(DB.interests[k]<0.3) delete DB.interests[k]; });
  tags.forEach(t=>{ DB.interests[t]=Math.round(((DB.interests[t]||0)+w)*10)/10; });
  const keys=Object.keys(DB.interests);
  if(keys.length>40) keys.sort((a,b)=>DB.interests[b]-DB.interests[a]).slice(40).forEach(k=>delete DB.interests[k]);
  scheduleSaveInterests();
}
function scheduleSaveInterests(){ clearTimeout(interestTimer); interestTimer=setTimeout(saveInterests,2000); }
async function saveInterests(){
  if(!onlineMode || !DB.currentUserDocId) return;
  try{ chk(await sb.from('users').update({interests:DB.interests}).eq('id',DB.currentUserDocId)); }
  catch(e){ console.warn(e); if(!interestWarned){ interestWarned=true; toast('おすすめの学習結果を保存するには、追加のSQL設定が必要です'); } }
}
function learnFromSearch(q){
  q=q.trim();
  if(!q || q===lastLearnedQuery || !DB.currentUser) return;
  lastLearnedQuery=q;
  const tagHits=new Set(), titleTags=new Set();
  DB.recipes.forEach(r=>(r.tags||[]).forEach(t=>{ if(t.includes(q)||q.includes(t)) tagHits.add(t); }));
  DB.recipes.filter(r=>r.title.includes(q)).slice(0,5).forEach(r=>(r.tags||[]).forEach(t=>titleTags.add(t)));
  bumpTags([...tagHits],1.5);
  bumpTags([...titleTags].filter(t=>!tagHits.has(t)),0.7);
}
function interestBanner(q){
  if(q || !DB.currentUser) return '';
  const top=Object.keys(DB.interests).sort((a,b)=>DB.interests[b]-DB.interests[a]).slice(0,3);
  if(!top.length) return '';
  return '<div style="padding:14px 0 0;font-size:12.5px;color:var(--ink-soft)">あなたへのおすすめ：'+
    top.map(t=>'<span class="tag" style="cursor:pointer;margin-left:4px" onclick="searchTag(decodeURIComponent(\''+encodeURIComponent(t)+'\'))">'+esc(t)+'</span>').join('')+'</div>';
}
function searchTag(t){ const i=document.getElementById('searchInput'); i.value=t; i.dispatchEvent(new Event('input')); }
function renderFeed(){
  const q=(document.getElementById('searchInput').value||'').trim();
  let list;
  if(q){
    list=DB.recipes.filter(r=> r.title.includes(q) || (r.tags||[]).some(t=>t.includes(q)) || r.author.includes(q))
      .map(r=>({r,s:searchRelevance(r,q)*2+personalScore(r)*0.5})).sort((a,b)=>b.s-a.s).map(x=>x.r);
  } else {
    if(needRank || !feedOrder.length){ feedOrder=DB.recipes.slice().sort((a,b)=>personalScore(b)-personalScore(a)).map(r=>r.id); needRank=false; }
    const byId={}; DB.recipes.forEach(r=>{ byId[r.id]=r; });
    const known=feedOrder.filter(id=>byId[id]).map(id=>byId[id]);
    const seen=new Set(feedOrder);
    list=DB.recipes.filter(r=>!seen.has(r.id)).concat(known);
  }
  ensureAuthorProfiles([...new Set(list.map(r=>r.author))]).then(async ()=>{
    const el=document.getElementById('feedView');
    if(!onlineMode){ el.innerHTML='<div class="empty"><h3>Supabaseが未設定です</h3><p>index.html内のSUPABASE_URLを設定してください</p></div>'; return; }
    if(!list.length){ el.innerHTML=adminBar('public')+'<div class="empty"><h3>'+t('empty_no_public_title')+'</h3><p>'+t('empty_no_public_desc')+'</p></div>'; return; }
    let tr={};
    if(LANG!=='ja'){ try{ tr=Object.fromEntries(await Promise.all(list.map(async r=>[r.id, await translateRecipe(r,false)]))); }catch(e){ console.warn(e); } }
    el.innerHTML=adminBar('public')+interestBanner(q)+list.map(r=>{
      const liked=DB.currentUser && (r.likes||[]).includes(DB.currentUser);
      const saved=DB.currentUser && DB.saved.includes(r.id);
      const inMy=DB.currentUser && DB.myRecipes.some(m=>m.sourceId===r.id);
      const disp=tr[r.id]||r;
      return '<div class="feedcard">'+
        '<div class="author" onclick="openUserPage(\''+r.author+'\')"><div class="avatar">'+avatarContent(r.author)+'</div><b>'+r.author+'</b></div>'+
        '<div class="photo">'+photoContent(r)+'</div>'+
        '<div class="title">'+esc(disp.title)+'</div>'+
        '<div class="tags">'+(disp.tags||[]).map(tg=>'<span class="tag">'+esc(tg)+'</span>').join('')+'</div>'+
        '<div class="actions">'+
          '<button class="'+(liked?'on':'')+'" onclick="toggleLike(\''+r.id+'\')">♥ '+(r.likes||[]).length+'</button>'+
          '<button class="'+(saved?'on':'')+'" onclick="toggleSave(\''+r.id+'\')">'+(saved?t('btn_saved'):t('btn_save_action'))+'</button>'+
          '<button class="'+(inMy?'on':'')+'" onclick="addToMy(\''+r.id+'\')">'+(inMy?t('btn_added'):t('btn_add_to_my'))+'</button>'+
          (DB.isAdmin ? '<button style="color:#B3432E" onclick="adminDeleteRecipe(\''+r.id+'\')">'+t('btn_delete_admin')+'</button>' : '')+
          '<button class="viewlink" onclick="openDetail(\''+r.id+'\')">'+t('btn_view_recipe')+'</button>'+
        '</div></div>';
    }).join('');
  });
}
function toggleLike(id){
  requireLogin(async ()=>{
    const r=DB.recipes.find(x=>x.id===id); if(!r) return;
    const likes=(r.likes||[]).slice(); const i=likes.indexOf(DB.currentUser);
    if(i>-1) likes.splice(i,1); else { likes.push(DB.currentUser); bumpTags(r.tags||[],3); }
    try{ chk(await sb.from('recipes').update({likes}).eq('id',id)); r.likes=likes; renderAll(); }
    catch(e){ console.error(e); toast(t('err_network')+'：'+errMsg(e)); }
  });
}
function toggleSave(id){
  requireLogin(async ()=>{
    const saved=DB.saved.slice(); const i=saved.indexOf(id);
    if(i>-1) saved.splice(i,1); else { saved.push(id); const rr=DB.recipes.find(x=>x.id===id); if(rr) bumpTags(rr.tags||[],3); }
    try{ chk(await sb.from('users').update({saved_ids:saved}).eq('id',DB.currentUserDocId)); DB.saved=saved; toast(i>-1?t('toast_unsaved'):t('toast_saved')); renderAll(); }
    catch(e){ console.error(e); toast(t('err_network')+'：'+errMsg(e)); }
  });
}
function addToMy(id){
  requireLogin(async ()=>{
    const src=DB.recipes.find(x=>x.id===id); if(!src) return;
    bumpTags(src.tags||[],4);
    if(DB.myRecipes.some(m=>m.sourceId===id)){ toast(t('toast_already_added')); return; }
    try{
      chk(await sb.from('myrecipes').insert({owner:DB.currentUser,source_id:id,title:src.title,photo:src.photo||null,ingredients:src.ingredients||[],steps:src.steps||[],tags:src.tags||[],is_public:false,created:Date.now()}));
      await refreshMyRecipes(); toast(t('toast_added_my')); renderAll();
    }catch(e){ console.error(e); toast(t('err_network')+'：'+errMsg(e)); }
  });
}

/* ---------- 管理者：表から一括投稿（Googleスプレッドシートのコピーを貼り付け） ---------- */
let bulkRows=[], bulkBusy=false;
function adminBar(mode){
  if(!DB.isAdmin) return '';
  const label = mode==='my' ? '表からMyレシピに一括追加（管理者）' : '表から一括投稿（管理者）';
  return '<div style="padding:14px 0 0"><button class="secondary" style="border-color:#E9C3B8;color:#B3432E" onclick="openBulkModal(\''+mode+'\')">'+label+'</button></div>';
}
function parseTSV(text){
  const rows=[]; let row=[], cur='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else inQ=false; }
      else cur+=c;
    } else if(c==='"' && cur===''){ inQ=true; }
    else if(c==='\t'){ row.push(cur); cur=''; }
    else if(c==='\n' || c==='\r'){
      if(c==='\r' && text[i+1]==='\n') i++;
      row.push(cur); cur=''; rows.push(row); row=[];
    } else cur+=c;
  }
  if(cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function rowToRecipe(r){
  const title=(r[0]||'').trim();
  const ingredients=(r[1]||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const steps=(r[2]||'').split(/\r?\n/).map(l=>l.trim().replace(/^\d+[\.\)．）]\s*/,'')).filter(Boolean);
  const tags=(r[3]||'').split(/[,、]/).map(t=>t.trim()).filter(Boolean);
  const missing=[];
  if(!title) missing.push('レシピ名'); if(!ingredients.length) missing.push('材料');
  if(!steps.length) missing.push('作り方'); if(!tags.length) missing.push('タグ');
  return {title,ingredients,steps,tags,missing,ok:missing.length===0};
}
function openBulkModal(mode){
  if(!DB.isAdmin) return;
  bulkMode = mode==='my' ? 'my' : 'public';
  if(!DB.currentUser){ requireLogin(()=>openBulkModal(bulkMode)); return; }
  bulkRows=[];
  const dest = bulkMode==='my' ? '「'+esc(DB.currentUser)+'」のMyレシピに、非公開で追加されます。' : '「'+esc(DB.currentUser)+'」の名前で公開レシピに投稿されます。';
  showModal(
    '<button class="mclose" onclick="closeModal()">×</button>'+
    '<h2>'+(bulkMode==='my'?'表からMyレシピに一括追加':'表から一括投稿')+'</h2>'+
    '<p style="color:var(--ink-soft);font-size:13px;margin-top:-8px">'+dest+'</p>'+
    '<p style="font-size:13px;color:var(--ink-soft)">Googleスプレッドシートで、左の列から <b>レシピ名｜材料｜作り方｜タグ</b> の順に入力し、範囲を選んでコピー（Ctrl+C）→ 下に貼り付けてください。1行目の見出しはあってもなくてもOKです。材料・作り方はセル内で改行、タグは「,」か「、」で区切ります。写真は付きません（最大100件）。</p>'+
    '<div class="field"><textarea id="bulk_text" style="min-height:110px" placeholder="ここに貼り付け" oninput="bulkPreview()"></textarea></div>'+
    '<div id="bulk_preview"></div>'+
    '<button class="primary" id="bulkBtn" style="margin-top:12px" onclick="submitBulk()" disabled>投稿する</button>'
  );
}
function bulkPreview(){
  let rows=parseTSV(document.getElementById('bulk_text').value);
  if(rows.length && rows[0][0].trim()==='レシピ名') rows=rows.slice(1);
  bulkRows=rows.slice(0,100).map(rowToRecipe);
  const over=rows.length>100;
  const okN=bulkRows.filter(x=>x.ok).length, ngN=bulkRows.length-okN;
  const el=document.getElementById('bulk_preview');
  if(!bulkRows.length){ el.innerHTML=''; document.getElementById('bulkBtn').disabled=true; document.getElementById('bulkBtn').textContent='投稿する'; return; }
  el.innerHTML=
    '<div style="font-size:13px;margin-bottom:6px">投稿できる行：<b>'+okN+'</b>件'+(ngN?' ／ 不足のある行（投稿されません）：<b style="color:#B3432E">'+ngN+'</b>件':'')+(over?' ／ 101件目以降は無視します':'')+'</div>'+
    '<div style="overflow-x:auto;border:1px solid var(--line);border-radius:10px"><table style="border-collapse:collapse;font-size:12px;width:100%;min-width:520px">'+
    '<tr style="background:var(--tag-bg);text-align:left"><th style="padding:6px 8px">#</th><th style="padding:6px 8px">レシピ名</th><th style="padding:6px 8px">材料</th><th style="padding:6px 8px">作り方</th><th style="padding:6px 8px">タグ</th></tr>'+
    bulkRows.map((x,i)=>'<tr style="border-top:1px solid var(--line);vertical-align:top;'+(x.ok?'':'background:rgba(179,67,46,.08)')+'">'+
      '<td style="padding:6px 8px">'+(i+1)+'</td>'+
      '<td style="padding:6px 8px">'+esc(x.title)+(x.ok?'':'<div style="color:#B3432E">不足：'+x.missing.join('・')+'</div>')+'</td>'+
      '<td style="padding:6px 8px">'+x.ingredients.length+'件</td>'+
      '<td style="padding:6px 8px">'+x.steps.length+'手順</td>'+
      '<td style="padding:6px 8px">'+esc(x.tags.join('、'))+'</td></tr>').join('')+
    '</table></div>';
  const b=document.getElementById('bulkBtn');
  b.disabled=okN===0; b.textContent=okN?okN+'件を投稿する':'投稿する';
}
async function submitBulk(){
  if(!DB.isAdmin || !DB.currentUser || bulkBusy) return;
  const valid=bulkRows.filter(x=>x.ok);
  if(!valid.length) return;
  const dest = bulkMode==='my' ? 'Myレシピ（非公開）に追加' : '公開レシピに投稿';
  if(!confirm(valid.length+'件を「'+DB.currentUser+'」の名前で'+dest+'しますか？')) return;
  bulkBusy=true;
  const now=Date.now();
  try{
    if(bulkMode==='my'){
      const payload=valid.map((x,i)=>({owner:DB.currentUser,source_id:null,title:x.title,photo:null,ingredients:x.ingredients,steps:x.steps,tags:x.tags,is_public:false,created:now-i}));
      chk(await sb.from('myrecipes').insert(payload));
      closeModal(); await refreshMyRecipes(); toast(valid.length+'件をMyレシピに追加しました'); renderAll();
    } else {
      const payload=valid.map((x,i)=>({author:DB.currentUser,title:x.title,photo:null,ingredients:x.ingredients,steps:x.steps,tags:x.tags,likes:[],created:now-i}));
      chk(await sb.from('recipes').insert(payload));
      closeModal(); needRank=true; await loadRecipes(); toast(valid.length+'件を投稿しました'); renderAll();
    }
  }catch(e){ console.error(e); toast('一括投稿に失敗しました：'+errMsg(e)); }
  bulkBusy=false;
}

  el.innerHTML=
    '<div class="panel"><div class="mprow"><label class="avatar-upload" id="mpPhotoPreview">'+(u.photo?'<img src="'+u.photo+'">':ICON_PERSON)+
    '<input type="file" accept="image/*" style="display:none" onchange="onProfilePhotoPicked(event)"></label>'+
    '<div style="flex:1"><input id="mp_name" type="text" value="'+esc(DB.currentUser)+'" style="border:none;background:none;font-size:17px;font-weight:700;padding:0;color:var(--ink);width:100%"></div></div>'+
    '<div class="field"><label>'+t('profile_bio_label')+'</label><input id="mp_bio" type="text" value="'+esc(u.bio||'')+'" placeholder="'+esc(t('profile_bio_ph'))+'"></div>'+
    '<button class="secondary" onclick="saveProfile()">'+t('btn_save_profile')+'</button>'+
    '<button class="secondary danger" style="margin-top:10px" onclick="logout()">'+t('btn_logout')+'</button>'+
    '<div class="msection" style="margin-top:28px"><h3>'+t('find_follow_title')+'</h3>'+
      '<div class="field" style="margin-bottom:8px"><input id="followSearchInput" type="text" placeholder="'+esc(t('find_follow_ph'))+'" oninput="onFollowSearchInput()"></div>'+
      '<div id="followSearchResults"></div></div>'+
    '<div class="msection"><h3>'+t('following_users_title')+'（'+DB.follows.length+'）</h3><div class="followlist">'+
      (DB.follows.length? DB.follows.map(f=>'<span onclick="switchTab(\'feed\');openUserPage(\''+f+'\')" style="cursor:pointer">'+esc(f)+'</span>').join('') : '<span style="color:var(--ink-soft);background:none;padding:0">'+t('none_yet')+'</span>')+'</div></div>'+
    '<div class="msection"><h3>'+t('saved_recipes_title')+'（'+savedRecipes.length+'）</h3>'+
      (savedRecipes.length? savedRecipes.map(r=>row(r)+'</div></div>').join('') : '<p style="color:var(--ink-soft);font-size:13.5px">'+t('no_saved')+'</p>')+'</div>'+
    '<div class="msection"><h3>'+t('published_recipes_title')+'（'+mine.length+'）</h3>'+
      (mine.length? mine.map(r=>row(r)+'<button class="smallbtn" onclick="deletePublished(\''+r.id+'\')">'+t('btn_delete')+'</button></div></div>').join('') : '<p style="color:var(--ink-soft);font-size:13.5px">'+t('no_published')+'</p>')+'</div></div>';
}
function onFollowSearchInput(){
  clearTimeout(followSearchTimer);
  const q=document.getElementById('followSearchInput').value.trim();
  const el=document.getElementById('followSearchResults');
  if(!q){ el.innerHTML=''; return; }
  followSearchTimer=setTimeout(async ()=>{
    try{
      const rows=chk(await sb.from('users').select('username').ilike('username','%'+q+'%').limit(8));
      followSearchResults=rows.map(r=>r.username).filter(n=>n!==DB.currentUser);
      renderFollowSearchResults();
    }catch(e){ console.error(e); }
  },350);
}
function renderFollowSearchResults(){
  const el=document.getElementById('followSearchResults'); if(!el) return;
  if(!followSearchResults.length){ el.innerHTML='<p style="color:var(--ink-soft);font-size:13px">'+t('no_matching_user')+'</p>'; return; }
  el.innerHTML=followSearchResults.map(name=>{
    const on=DB.follows.includes(name);
    return '<div class="feedcard" style="padding:10px 0;display:flex;align-items:center;gap:10px">'+
      '<div class="avatar" style="width:30px;height:30px">'+avatarContent(name)+'</div>'+
      '<b style="flex:1;font-size:14px;cursor:pointer" onclick="switchTab(\'feed\');openUserPage(\''+name+'\')">'+esc(name)+'</b>'+
      '<button class="followbtn '+(on?'on':'')+'" style="margin-left:0" onclick="toggleFollowFromSearch(\''+name+'\')">'+(on?t('following'):t('follow'))+'</button></div>';
  }).join('');
}
function toggleFollowFromSearch(username){
  requireLogin(async ()=>{
    const follows=DB.follows.slice(); const i=follows.indexOf(username);
    if(i>-1) follows.splice(i,1); else follows.push(username);
    try{ chk(await sb.from('users').update({follows}).eq('id',DB.currentUserDocId)); DB.follows=follows; renderMypage(); onFollowSearchInput.lastQ=null; document.getElementById('followSearchInput') && (document.getElementById('followSearchInput').value=username); renderFollowSearchResults(); }
    catch(e){ console.error(e); toast(t('err_network')+'：'+errMsg(e)); }
  });
}
function onProfilePhotoPicked(e){
  const file=e.target.files[0]; if(!file) return;
  const p=document.getElementById('mpPhotoPreview');
  p.innerHTML='<span style="font-size:11px">'+t('photo_processing')+'</span><input type="file" accept="image/*" style="display:none" onchange="onProfilePhotoPicked(event)">';
  compressImage(file,240,30000).then(d=>{
    tempProfilePhoto=d;
    p.innerHTML='<img src="'+d+'"><input type="file" accept="image/*" style="display:none" onchange="onProfilePhotoPicked(event)">';
  }).catch(()=>{
    toast(t('err_photo_failed'));
    p.innerHTML=ICON_PERSON+'<input type="file" accept="image/*" style="display:none" onchange="onProfilePhotoPicked(event)">';
  });
}
async function saveProfile(){
  const newName=document.getElementById('mp_name').value.trim()||DB.currentUser;
  const bio=document.getElementById('mp_bio').value.trim();
  const old=DB.currentUser;
  const photo=tempProfilePhoto!==undefined ? tempProfilePhoto : (DB.users[old]?DB.users[old].photo:null);
  try{
    if(newName!==old){
      const dup=chk(await sb.from('users').select('id').eq('username',newName).limit(1));
      if(dup.length){ toast(t('err_username_taken')); return; }
    }
    chk(await sb.from('users').update({username:newName,bio,photo}).eq('id',DB.currentUserDocId));
    if(newName!==old){
      chk(await sb.from('recipes').update({author:newName}).eq('author',old));
      chk(await sb.from('myrecipes').update({owner:newName}).eq('owner',old));
      DB.currentUser=newName;
      try{ localStorage.setItem(SESSION_KEY,newName); }catch(e){}
    }
    DB.users[newName]={bio,photo,email:(DB.users[old]?DB.users[old].email:undefined)};
    tempProfilePhoto=undefined;
    await loadRecipes(); await refreshMyRecipes();
    toast(t('toast_profile_saved')); renderAll();
  }catch(e){ console.error(e); toast(t('err_save_failed')+'：'+errMsg(e)); }
}
async function deletePublished(id){
  if(!confirm(t('confirm_delete_published')))return;
  try{ chk(await sb.from('recipes').delete().eq('id',id)); await loadRecipes(); renderAll(); }
  catch(e){ console.error(e); toast(t('err_save_failed')+'：'+errMsg(e)); }
}

/* ---------- modal / render ---------- */
function showModal(inner){
  document.getElementById('modalRoot').innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">'+inner+'</div></div>';
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function renderAll(){
  renderUserArea(); updateAddBtn();
  if(currentTab==='feed' && !viewedUser) renderFeed();
  if(currentTab==='my') renderMy();
  if(currentTab==='mypage') renderMypage();
  if(currentTab==='settings') renderSettings();
}
document.getElementById('searchInput').addEventListener('input', ()=>{
  if(currentTab==='feed'){ needRank=true; renderFeed(); }
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>learnFromSearch(document.getElementById('searchInput').value),1500);
});
document.getElementById('feedView').innerHTML='<div class="empty">'+t('loading')+'</div>';
document.querySelectorAll('.navicon').forEach(el=>{ el.innerHTML=NAV_ICONS[el.dataset.icon]||''; });
applyI18nStatic();
initBackend();
</script>
</body>
</html>
